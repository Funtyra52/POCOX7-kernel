name: Build Custom Android GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            glibc-source \
            libelf-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            ninja-build \
            repo \
            rsync \
            u-boot-tools \
            xz-utils \
            zip

      - name: Sync Android GKI Source
        run: |
          mkdir -p kernel
          cd kernel

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git config --global color.ui false

          repo init -u https://googlesource.com -b common-android-mainline --depth=1 --no-repo-verify
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Integrate KernelSU Next
        run: |
          cd kernel/common
          curl -LSs https://githubusercontent.com | bash -s next

      - name: Apply Performance Tweaks
        run: |
          CONFIG_FILE="kernel/common/arch/arm64/configs/gki_defconfig"

          # Отключение стандартного schedutil
          sed -i 's/CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y/# CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set/' "$CONFIG_FILE"

          # Включение производительного планировщика CPU (Performance)
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> "$CONFIG_FILE"

          # Включение Multi-Gen LRU (MGLRU) для оптимизации работы ОЗУ
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"
          echo "CONFIG_LRU_GEN_ENABLED=y" >> "$CONFIG_FILE"

          # Включение планировщика ввода-вывода Kyber для ускорения UFS флеш-памяти
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> "$CONFIG_FILE"

          # ФИКС ОШИБКИ BAZEL: Принудительно регенерируем gki_defconfig по правилам Google
          cd kernel/common
          make ARCH=arm64 defconfig
          make ARCH=arm64 savedefconfig
          cp defconfig arch/arm64/configs/gki_defconfig

      - name: Compile GKI Kernel
        run: |
          cd kernel
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=../dist

      - name: Pack Kernel into AnyKernel3 Zip
        run: |
          git clone https://github.com AnyKernel3

          # Копирование собранного ядра
          cp dist/Image AnyKernel3/

          # Настройка скрипта прошивальщика под универсальный GKI-формат
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh

          # Упаковка в zip-архив
          cd AnyKernel3
          zip -r9 ../custom-gki-kernel.zip * -x .git* README.md *placeholder
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-GKI-6.1-Malachite
          path: custom-gki-kernel.zip
          retention-days: 7
