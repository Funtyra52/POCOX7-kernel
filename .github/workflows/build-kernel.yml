name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc
          sudo apt-get install -y bison
          sudo apt-get install -y build-essential
          sudo apt-get install -y ccache
          sudo apt-get install -y curl
          sudo apt-get install -y flex
          sudo apt-get install -y g++-multilib
          sudo apt-get install -y gcc-multilib
          sudo apt-get install -y gnupg
          sudo apt-get install -y gperf
          sudo apt-get install -y lib32readline-dev
          sudo apt-get install -y lib32z1-dev
          sudo apt-get install -y libelf-dev
          sudo apt-get install -y liblz4-tool
          sudo apt-get install -y libncurses5-dev
          sudo apt-get install -y libssl-dev
          sudo apt-get install -y libxml2
          sudo apt-get install -y libxml2-utils
          sudo apt-get install -y lzop
          sudo apt-get install -y pngcrush
          sudo apt-get install -y rsync
          sudo apt-get install -y schedtool
          sudo apt-get install -y squashfs-tools
          sudo apt-get install -y xsltproc
          sudo apt-get install -y zip
          sudo apt-get install -y zlib1g-dev
          sudo apt-get install -y python3
          sudo apt-get install -y git
          sudo apt-get install -y clang
          sudo apt-get install -y lld

      - name: Clone
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'malachite-u-oss'
          path: 'kernel-source'

      - name: KSU
        run: |
          cd kernel-source
          U1="https://github.com"
          U2="/tiann/KernelSU.git"
          git clone --depth=1 "$U1$U2" KernelSU-repo
          bash KernelSU-repo/kernel/setup.sh main

      - name: Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld
          
          # 1. Генерируем базовый конфиг ядра
          make gki_defconfig
          
          # 2. Отключаем проблемную подсистему BTF-отладки
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> .config
          
          # 3. Принудительно включаем KernelSU
          echo "CONFIG_KSU=y" >> .config
          
          # 4. ФИЗИЧЕСКИЙ РАЗГОН: Переписываем лимиты частот в конфигурационных файлах самого ядра
          # Меняем максимальный шаг Big-кластера с 2.5 ГГц до 2.7 ГГц
          sed -i 's/2500000/2700000/g' include/generated/autoconf.h 2>/dev/null || true
          sed -i 's/2500000/2700000/g' arch/arm64/configs/gki_defconfig 2>/dev/null || true
          
          # Меняем максимальный шаг Little-кластера с 2.0 ГГц до 2.25 ГГц
          sed -i 's/2000000/2250000/g' include/generated/autoconf.h 2>/dev/null || true
          sed -i 's/2000000/2250000/g' arch/arm64/configs/gki_defconfig 2>/dev/null || true
          
          # Заставляем планировщик заблокировать эти новые повышенные частоты
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> .config
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> .config
          
          # 5. Запускаем компиляцию строго только файла ядра Image
          make -j$(nproc) Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Poco_X7_Kernel
          path: kernel-source/arch/arm64/boot/Image
