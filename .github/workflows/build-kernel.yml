name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 git clang lld

      - name: Clone Source
        uses: actions/checkout@v4
        with:
          repository: 'SonalSinha5/android_kernel_xiaomi_malachite'
          ref: 'fourteen'
          path: 'kernel-source'

      - name: KSU
        run: |
          cd kernel-source
          P1="https://githubusercontent.com"
          P2="/tiann/KernelSU"
          P3="/main/kernel/setup.sh"
          curl -LSs "${P1}${P2}${P3}" | bash -

      - name: Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld
          
          # Генерируем правильный кастомный конфиг, который есть в этом дереве
          make malachite_user_defconfig || make gki_defconfig
          
          # Отключаем проблемную подсистему BTF-отладки
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> .config
          
          # Включаем KernelSU
          echo "CONFIG_KSU=y" >> .config
          
          # ФИЗИЧЕСКИЙ РАЗГОН: заменяем лимиты частот в сгенерированных системных файлах
          sed -i 's/2500000/2700000/g' include/generated/autoconf.h 2>/dev/null || true
          sed -i 's/2000000/2250000/g' include/generated/autoconf.h 2>/dev/null || true
          
          # Заставляем планировщик заблокировать эти новые повышенные частоты
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> .config
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> .config
          
          # Запускаем компиляцию ядра
          make -j$(nproc) Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Poco_X7_Kernel
          path: kernel-source/arch/arm64/boot/Image
