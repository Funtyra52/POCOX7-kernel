name: Build Custom Android GKI Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            glibc-source \
            libelf-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            ninja-build \
            repo \
            rsync \
            u-boot-tools \
            xz-utils \
            zip

      - name: Sync Android GKI Source
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

          mkdir -p kernel
          cd kernel

          repo init -u https://android.googlesource.com/kernel/manifest -b android14-6.1-2025-06 --depth=1 --no-repo-verify
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Integrate KernelSU Next
        run: |
          cd kernel/common
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s next

      - name: Apply Performance Tweaks
        run: |
          CONFIG_FILE="kernel/common/arch/arm64/configs/gki_defconfig"

          # Отключаем дефолтный schedutil и переключаем на performance
          sed -i 's/CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y/# CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set/' "$CONFIG_FILE"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> "$CONFIG_FILE"

          # Включение Multi-Gen LRU (MGLRU)
          echo "CONFIG_LRU_GEN=y" >> "$CONFIG_FILE"
          echo "CONFIG_LRU_GEN_ENABLED=y" >> "$CONFIG_FILE"

          # Включение Kyber I/O Scheduler для ускорения накопителей UFS/NVMe
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> "$CONFIG_FILE"

      - name: Compile GKI Kernel
        run: |
          cd kernel
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=../dist

      - name: Pack Kernel into AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Копируем скомпилированное ядро Image в AnyKernel3
          cp dist/Image AnyKernel3/

          # Настройка anykernel.sh под универсальный флешер GKI
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh

          # Создание архива
          cd AnyKernel3
          zip -r9 ../custom-gki-kernel.zip * -x .git* README.md *placeholder
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-GKI-6.1.138-Malachite
          path: custom-gki-kernel.zip
          retention-days: 7
