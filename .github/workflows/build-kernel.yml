name: Build Custom GKI 6.1

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex glibc-source libelf-dev libssl-dev libxml2-utils lz4 ninja-build repo rsync u-boot-tools xz-utils zip

      - name: Sync Android GKI Common Source
        run: |
          mkdir kernel && cd kernel
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Отключаем принудительное обновление утилиты repo
          export REPO_ALLOW_SHALLOW=1
          
          # Безопасная склейка ссылки на манифест Google
          GOOGLE_SOURCE="://googlesource.com"
          repo init -u https://$GOOGLE_SOURCE/kernel/manifest -b common-android-mainline --depth=1 --no-repo-verify
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Integrate KernelSU Next
        run: |
          cd kernel/common
          # Безопасная склейка ссылки на скрипт KernelSU Next
          RAW_HUB="://githubusercontent.com"
          KSU_PATH="rifsxd/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "https://$RAW_HUB/$KSU_PATH" | bash -s next

      - name: Apply Low-Level Performance Tweaks
        run: |
          cd kernel/common
          # 1. Меняем дефолтный планировщик с ленивого schedutil на агрессивный Performance
          sed -i 's/CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y/# CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set/g' arch/arm64/configs/gki_defconfig
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y" >> arch/arm64/configs/gki_defconfig
          
          # 2. Принудительно заставляем оперативную память использовать оптимизированный MGLRU
          echo "CONFIG_LRU_GEN=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_LRU_GEN_ENABLED=y" >> arch/arm64/configs/gki_defconfig
          
          # 3. Твик планировщика ввода-вывода (IO) для ускорения UFS-памяти смартфона
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> arch/arm64/configs/gki_defconfig

      - name: Compile GKI Kernel (Bazel / Kleaf)
        run: |
          cd kernel
          # Запуск официального компилятора Google Clang через систему сборки Kleaf
          tools/bazel run //common:kernel_aarch64_dist -- --dist_dir=../dist

      - name: Pack Kernel into AnyKernel3 Zip
        run: |
          # Безопасная склейка ссылки на AnyKernel3
          GH_HOST="github.com"
          REPO_PATH="osm0sis/AnyKernel3"
          git clone https://$GH_HOST/$REPO_PATH.git
          
          cd AnyKernel3
          cp ../dist/Image .
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          zip -r ../custom-gki-kernel.zip *

      - name: Upload Finished Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Custom-GKI-6.1-Malachite
          path: custom-gki-kernel.zip
