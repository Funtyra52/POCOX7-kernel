name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 git clang lld

      - name: Clone Kernel
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'malachite-u-oss'
          path: 'kernel-source'

      - name: Clone Build Tool
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/kernel_build'
          ref: 'malachite-u-oss'
          path: 'kernel-source/build'

      - name: KSU
        run: |
          cd kernel-source
          # Пишем ссылку кусками через пробел, чтобы чат её не обрезал
          STR1="https://raw."
          STR2="githubusercontent."
          STR3="com/tiann/KernelSU/main/kernel/setup.sh"
          curl -LSs "${STR1}${STR2}${STR3}" | bash -

      - name: Overclock
        run: |
          cd kernel-source
          echo "=== PATCH ==="
          find . -type f \( -name "*.dts" -o -name "*.dtsi" -o -name "*dvfs*.c" -o -name "*opp*.c" -o -name "*.h" \) | while read -r file; do
            if grep -q "2500000" "$file"; then
              sed -i 's/2500000/2700000/g' "$file"
            fi
            if grep -q "2000000" "$file"; then
              sed -i 's/2000000/2250000/g' "$file"
            fi
          done

      - name: Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export LD=ld.lld
          
          # Запускаем официальный скрипт сборки Xiaomi, который теперь на месте
          chmod +x build/build.sh
          build/build.sh
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Poco_X7_Kernel
          path: out/android*/dist/Image
