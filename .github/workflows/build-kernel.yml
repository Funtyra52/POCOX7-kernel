name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc
          sudo apt-get install -y bison
          sudo apt-get install -y build-essential
          sudo apt-get install -y ccache
          sudo apt-get install -y curl
          sudo apt-get install -y flex
          sudo apt-get install -y g++-multilib
          sudo apt-get install -y gcc-multilib
          sudo apt-get install -y gnupg
          sudo apt-get install -y gperf
          sudo apt-get install -y lib32readline-dev
          sudo apt-get install -y lib32z1-dev
          sudo apt-get install -y libelf-dev
          sudo apt-get install -y liblz4-tool
          sudo apt-get install -y libncurses5-dev
          sudo apt-get install -y libssl-dev
          sudo apt-get install -y libxml2
          sudo apt-get install -y libxml2-utils
          sudo apt-get install -y lzop
          sudo apt-get install -y pngcrush
          sudo apt-get install -y rsync
          sudo apt-get install -y schedtool
          sudo apt-get install -y squashfs-tools
          sudo apt-get install -y xsltproc
          sudo apt-get install -y zip
          sudo apt-get install -y zlib1g-dev
          sudo apt-get install -y python3
          sudo apt-get install -y git
          sudo apt-get install -y clang
          sudo apt-get install -y lld

      - name: Clone
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'malachite-u-oss'
          path: 'kernel-source'

      - name: KSU
        run: |
          cd kernel-source
          P1="https://githubusercontent.com"
          P2="/tiann/KernelSU"
          P3="/main/kernel/setup.sh"
          curl -LSs "$P1$P2$P3" | bash -

      - name: Overclock
        run: |
          cd kernel-source
          echo "=== Физический разгон ядер ==="
          # Ищем таблицы частот строго в папках архитектуры MediaTek, чтобы sed не выдавал ошибку пустого ввода
          TARGET_FILES=$(find arch/arm64/boot/dts/mediatek/ drivers/misc/mediatek/ -type f \( -name "*.dts" -o -name "*.dtsi" -o -name "*.c" -o -name "*.h" \) 2>/dev/null)
          
          # Жестко меняем лимиты: Big-ядра до 2700, Little-ядра до 2250
          echo "$TARGET_FILES" | xargs sed -i 's/2500000/2700000/g' 2>/dev/null || true
          echo "$TARGET_FILES" | xargs sed -i 's/2000000/2250000/g' 2>/dev/null || true
          echo "=== Разгон успешно вшит в исходники ==="

      - name: Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld
          
          make gki_defconfig
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          echo "# CONFIG_DEBUG_INFO_BTF is not set" >> .config
          echo "CONFIG_KSU=y" >> .config
          make -j$(nproc) Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Poco_X7_Kernel
          path: kernel-source/arch/arm64/boot/Image
